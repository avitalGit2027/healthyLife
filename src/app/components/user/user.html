<article class="member-card">
  <div class="member-card-top">
    <span class="member-avatar" aria-hidden="true">{{ user?.UserName?.charAt(0) }}</span>
    <span class="member-status" [class.inactive]="!user?.status">
      <span class="status-dot"></span>
      {{ user?.status ? 'פעיל/ה' : 'בהפסקה' }}
    </span>
  </div>
  <h3>{{ user?.UserName }}</h3>
  <p class="member-caption">חבר/ה בקהילת HealthyLife</p>
  <div class="member-details">
    <div class="detail-row">
      <span class="detail-icon" aria-hidden="true">
        <svg viewBox="0 0 20 20" fill="none"><rect x="2.5" y="4" width="15" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="m3.5 5 6.5 5 6.5-5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></svg>
      </span>
      <span>{{ user?.email }}</span>
    </div>
    <div class="detail-row">
      <span class="detail-icon" aria-hidden="true">
        <svg viewBox="0 0 20 20" fill="none"><path d="M6.1 2.8H4.3c-.8 0-1.5.7-1.4 1.5.6 7 5.8 12.2 12.8 12.8.8.1 1.5-.6 1.5-1.4v-1.8c0-.7-.5-1.3-1.2-1.4l-2.4-.4c-.5-.1-1 .1-1.3.5l-.8 1.1a14 14 0 0 1-4.9-4.9l1.1-.8c.4-.3.6-.8.5-1.3l-.4-2.4c-.1-.7-.7-1.2-1.4-1.2Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></svg>
      </span>
      <span>{{ user?.phone }}</span>
      <button >Dlete user</button>
    </div>
    
  </div>
</article>
